<title>Yui v0 Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mockup controls on top, one phone-sized app frame below. On a phone the frame fills the screen. */
:root{
  color-scheme: dark;
  --bg:#141110;          /* page behind the frame */
  --app:#1d1916;         /* app background, warm charcoal */
  --surface:#28221e;     /* cards */
  --surface-2:#332b26;   /* raised */
  --sidebar:#1f2226;     /* sidebar mode: cooler, so English mode reads as different */
  --line:#3a322c;
  --fg:#f3ebe3;          /* main text */
  --muted:#a89a8e;       /* romaji, labels */
  --faint:#74675d;
  --accent:#f0a87e;      /* apricot: Yui, mic */
  --accent-ink:#2a1a10;
  --wrong:#e58f8f;
  --right:#a9c9a0;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --ui:"Figtree","Zen Kaku Gothic New",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.shell{height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

/* Mockup controls (not part of the app) */
.controls{display:flex;flex-direction:column;gap:6px;max-width:390px;width:100%;margin:0 auto}
.controls .note{font-size:12px;color:var(--faint);letter-spacing:.02em}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--app);border-color:var(--fg)}
.chips.sub .chip{border-style:dashed}
.chips.sub .chip[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);border-style:solid;border-color:var(--accent)}

/* The phone frame */
.stage{flex:1;min-height:0;display:flex;justify-content:center}
.phone{width:100%;max-width:390px;height:100%;max-height:844px;background:var(--app);border-radius:28px;border:1px solid var(--line);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:480px){.phone{border-radius:18px}.controls .note{display:none}.shell{gap:8px;padding-block:8px}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* Furigana and romaji */
.jp{font-family:var(--jp);word-break:auto-phrase}
ruby{ruby-position:over}
rt{font-size:.48em;color:var(--muted);font-weight:400;letter-spacing:.02em}
.romaji{color:var(--muted);font-family:var(--ui);font-size:14px}

/* Conversation */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.textbtn{font-size:14px;color:var(--muted);padding:6px 4px}
.youbtn{width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--fg);display:grid;place-items:center}
.face{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 4px}
.avatar{width:96px;height:96px;border-radius:50%;position:relative;background:radial-gradient(circle at 38% 35%,#f6c7a6 0,#e7a07a 45%,#b8714f 100%);display:grid;place-items:center}
.avatar::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent);opacity:0}
.avatar .kana{font-family:var(--jp);font-weight:700;color:#3a2016;font-size:26px;opacity:.75}
.face .name{font-size:13px;color:var(--muted);letter-spacing:.06em}
.face .status{font-size:12px;color:var(--faint);min-height:18px}
[data-state="talking"] .avatar::after,[data-state="first"] .avatar::after,[data-state="welcome"] .avatar::after{animation:pulse 1.6s ease-out infinite}
[data-state="thinking"] .avatar{filter:saturate(.7)}
@keyframes pulse{0%{opacity:.7;transform:scale(.94)}100%{opacity:0;transform:scale(1.12)}}

.convo{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:8px 20px 0;overflow-y:auto}
.mine{align-self:flex-end;text-align:right;max-width:85%;display:flex;flex-direction:column;gap:2px}
.mine .jp{font-size:16px;color:#d9cec4}
.mine .label{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.mine.en .text{font-size:15px;color:#d9cec4}

.fix{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fix .head{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.fixrow{display:flex;flex-direction:column;gap:2px}
.fixrow .pair{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;font-size:17px}
.fixrow s{color:var(--wrong);text-decoration-thickness:1.5px}
.fixrow .arrow{color:var(--faint);font-size:14px}
.fixrow .ok{color:var(--right)}
.fixrow .why{font-size:13px;color:var(--muted)}

.yui{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:6px 0 10px}
.yui .jp{font-size:27px;line-height:1.9;font-weight:500;text-wrap:balance}
.yui .romaji{font-size:15px}
.thinking{display:flex;gap:6px;justify-content:center;padding:26px 0}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.summary{font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.done{font-size:13px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}

/* Sidebar mode */
[data-state="sidebar"] .screen.conv{background:var(--sidebar)}
[data-state="sidebar"] .face{flex-direction:row;justify-content:center;gap:10px;padding:0}
[data-state="sidebar"] .avatar{width:40px;height:40px}
[data-state="sidebar"] .avatar .kana{font-size:12px}
[data-state="sidebar"] .avatar::after{inset:-5px;animation:pulse 1.6s ease-out infinite}
[data-state="sidebar"] .face .name{display:none}
[data-state="sidebar"] .convo{gap:10px}
.pinned{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
[data-state="sidebar"] .pinned,[data-state="sidebar"] .fix{background:#2a2d31}
.pinned .head{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.pinned .jp{font-size:16px;line-height:1.75}
.pinned .romaji{font-size:13px}
.mode{align-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9fb4c8;border:1px solid #3c4650;border-radius:999px;padding:3px 10px}
.en-answer{font-size:18px;line-height:1.5;text-align:center;text-wrap:balance}
.example{display:flex;flex-direction:column;align-items:center;gap:2px}
.example .jp{font-size:24px;line-height:1.9}

.micbar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 calc(18px + env(safe-area-inset-bottom,0px))}
.mic{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 24px rgba(240,168,126,.25);transition:transform .15s,opacity .15s}
.mic:active{transform:scale(.96)}
.mic svg{width:30px;height:30px}
[data-state="talking"] .mic,[data-state="thinking"] .mic,[data-state="first"] .mic,[data-state="welcome"] .mic{background:var(--surface-2);color:var(--fg);box-shadow:none}
[data-state="listening"] .mic{background:#f3ebe3;color:var(--app);box-shadow:0 0 0 10px rgba(243,235,227,.08),0 0 0 22px rgba(243,235,227,.04)}
.hint{font-size:12px;color:var(--faint);min-height:18px}
.wave{display:flex;gap:3px;align-items:center;justify-content:center;height:40px}
.wave i{width:4px;border-radius:2px;background:var(--fg);opacity:.8;animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{height:8px}50%{height:34px}}

/* Sub screens */
.subhead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.back{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:4px;padding:4px 2px}
.subhead h1{font-size:16px;font-weight:600;margin:0;flex:1;text-align:center;padding-right:44px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}

/* Transcript */
.divider{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);margin:6px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.t-yui{align-self:flex-start;max-width:88%;display:flex;flex-direction:column;gap:1px}
.t-yui .jp{font-size:17px;line-height:1.8}
.t-yui .romaji{font-size:13px}
.t-me{align-self:flex-end;max-width:85%;text-align:right;background:var(--surface);border-radius:14px 14px 4px 14px;padding:8px 12px}
.t-me .jp{font-size:16px}
.t-en{align-self:flex-start;max-width:88%;border-left:2px solid #4a5866;padding:2px 0 2px 10px;font-size:14px;color:#c9d3dc}
.t-en .jp{font-size:16px;color:var(--fg)}
.t-fix{align-self:flex-end;max-width:85%;font-size:13px;display:flex;flex-direction:column;gap:2px;text-align:right}
.t-fix .pair{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:baseline}
.t-fix s{color:var(--wrong)} .t-fix .ok{color:var(--right);font-size:15px} .t-fix .why{color:var(--muted)}
.t-end{align-self:center;font-size:12px;color:var(--faint)}

/* Profile */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:8px}
.section h2{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 0}
.chart{background:var(--surface);border-radius:12px;padding:12px}
.chart svg{display:block;width:100%;height:auto}
.level{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.level .big{font-size:22px;font-weight:600}
.level .big small{font-size:15px;font-weight:400;color:var(--muted)}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.part{display:flex;flex-direction:column;gap:5px}
.part .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.part .row b{font-weight:500}
.part .row span{color:var(--muted);font-variant-numeric:tabular-nums}
.part p{margin:0;font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:12px}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column}
.item .main b{font-weight:500}
.item .main span{font-size:12.5px;color:var(--muted)}
.item .go{color:var(--faint)}
.tag{font-size:11px;color:var(--wrong);border:1px solid #5a3a3a;border-radius:999px;padding:1px 7px}
.empty{background:var(--surface);border-radius:12px;padding:18px 14px;color:var(--muted);font-size:14px;text-align:center}
.del{font-size:13px;color:var(--faint);padding:4px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit}
.add button{background:var(--surface-2);border-radius:10px;padding:0 14px;font-size:14px}
.small{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <div class="controls" aria-label="Mockup controls">
    <div class="note">Mockup. Tap the mic to move through a turn, or jump to a screen.</div>
    <div class="chips" id="screens"></div>
    <div class="chips sub" id="states"></div>
  </div>
  <div class="stage">
    <div class="phone" id="phone"></div>
  </div>
</div>

<script>
// ---------- Data, in the same segment format Yui returns ----------
// A seg is [text] or [text, reading]. Kanji pieces carry their reading.
const L = {
  hello:{seg:[["はじめまして！ユイです。"],["今日","きょう"],["はどうでしたか？"]],romaji:"Hajimemashite! Yui desu. Kyou wa dou deshita ka?"},
  greet:{seg:[["おかえりなさい！"],["週末","しゅうまつ"],["は"],["何","なに"],["をしましたか？"]],romaji:"Okaeri nasai! Shuumatsu wa nani o shimashita ka?"},
  ask:{seg:[["いいですね！"],["何","なん"],["の"],["映画","えいが"],["を"],["見","み"],["ましたか？"]],romaji:"Ii desu ne! Nan no eiga o mimashita ka?"},
  again:{seg:[["じゃあ、"],["何","なん"],["の"],["映画","えいが"],["を"],["見","み"],["ましたか？"]],romaji:"Jaa, nan no eiga o mimashita ka?"},
  where:{seg:[["いいですね。どこで"],["見","み"],["ましたか？"]],romaji:"Ii desu ne. Doko de mimashita ka?"},
  fun:{seg:[["映画館","えいがかん"],["に"],["行","い"],["きましたか！"],["楽","たの"],["しかったですか？"]],romaji:"Eigakan ni ikimashita ka! Tanoshikatta desu ka?"},
  good:{seg:[["よかったです！"],["次","つぎ"],["は"],["何","なに"],["を"],["見","み"],["たいですか？"]],romaji:"Yokatta desu! Tsugi wa nani o mitai desu ka?"},
  bye:{seg:[["楽","たの"],["しかったです！またね。"]],romaji:"Tanoshikatta desu! Mata ne."},
  ex:{seg:[["何","なん"],["の"],["本","ほん"],["ですか？"]],romaji:"Nan no hon desu ka?"},
  // yesterday
  y1:{seg:[["こんにちは！"],["今日","きょう"],["は"],["何","なに"],["をしましたか？"]],romaji:"Konnichiwa! Kyou wa nani o shimashita ka?"},
  y2:{seg:[["お"],["疲","つか"],["れさまです。"],["私","わたし"],["はパンを"],["焼","や"],["きました。"]],romaji:"Otsukaresama desu. Watashi wa pan o yakimashita."},
  y3:{seg:[["焼","や"],["く"]],romaji:"yaku"},
  y4:{seg:[["パンは"],["好","す"],["きですか？"]],romaji:"Pan wa suki desu ka?"},
  y5:{seg:[["私","わたし"],["もです！"],["明日","あした"],["も"],["話","はな"],["しましょう。"]],romaji:"Watashi mo desu! Ashita mo hanashimashou."},
};
const F = {
  miru:{wrong:"みるました",right:[["見","み"],["ました"]],why:"Past polite: verb stem + ました"},
  ni:{wrong:"えいがかんでいきました",right:[["映画館","えいがかん"],["に"],["行","い"],["きました"]],why:"Use に for where you go"},
  kat:{wrong:"おもしろいでした",right:[["おもしろかったです"]],why:"い-adjective past: drop い, add かった"},
};
const seg = s => s.map(([t,r]) => r ? `<ruby>${t}<rt>${r}</rt></ruby>` : t).join("");
const jp = (l,cls="") => `<div class="jp ${cls}">${seg(l.seg)}</div><div class="romaji">${l.romaji}</div>`;
const fixRow = f => `<div class="fixrow"><div class="pair jp"><s>${f.wrong}</s><span class="arrow">→</span><span class="ok">${seg(f.right)}</span></div><div class="why">${f.why}</div></div>`;
const MIC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
const STOP = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>`;

// ---------- Thread ----------
const yesterday = [
  {y:L.y1},{me:"しごとをしました。",r:"Shigoto o shimashita."},{y:L.y2},
  {q:"What does yakimashita mean?"},
  {en:"It means baked. It's the past form of this verb, to bake:",ex:L.y3},
  {q:"ok got it"},{y:L.y4},{me:"はい、パンがすきです。",r:"Hai, pan ga suki desu."},{y:L.y5},
  {me:"またね！",r:"Mata ne!"},{end:"Session done · 9 min · no fixes"}
];
const today = [
  {y:L.greet},{me:"きのう、えいがをみるました。",r:"Kinou, eiga o mirumashita.",fix:[F.miru]},{y:L.ask},
  {q:"What does nan no mean?"},
  {en:"It means what kind of, or which. It goes right before a noun. For example:",ex:L.ex},
  {q:"ok"},{y:L.again},{me:"トトロを見ました。",r:"Totoro o mimashita."},{y:L.where},
  {me:"えいがかんでいきました。",r:"Eigakan de ikimashita.",fix:[F.ni]},{y:L.fun},
  {me:"はい、とてもおもしろいでした。",r:"Hai, totemo omoshiroi deshita.",fix:[F.kat]},{y:L.good},
  {me:"またね！",r:"Mata ne!"},{y:L.bye},{end:"Session done · 12 min · 3 fixes"}
];
function threadHTML(lines){
  return lines.map(x=>{
    if(x.y) return `<div class="t-yui">${jp(x.y)}</div>`;
    if(x.me) return `<div class="t-me"><div class="jp">${x.me}</div><div class="romaji">${x.r}</div></div>` +
      (x.fix?`<div class="t-fix">${x.fix.map(f=>`<div class="pair jp"><s>${f.wrong}</s><span class="ok">${seg(f.right)}</span></div><div class="why">${f.why}</div>`).join("")}</div>`:"");
    if(x.q) return `<div class="t-me"><div>${x.q}</div></div>`;
    if(x.en) return `<div class="t-en">${x.en}${x.ex?`<div style="margin-top:4px">${jp(x.ex)}</div>`:""}</div>`;
    if(x.end) return `<div class="t-end">${x.end}</div>`;
  }).join("");
}

// ---------- Screens ----------
const STATES = [
  ["first","First open"],["welcome","Welcome back"],["talking","Yui talking + fix"],["turn","Your turn"],["listening","Listening"],
  ["thinking","Thinking"],["sidebar","Sidebar"],["done","Session done"]
];
let screen = "conversation", state = "talking", youEmpty = false, timer;

function conversation(){
  const s = state;
  const status = {first:"Speaking",welcome:"Speaking",talking:"Speaking",turn:"",listening:"",thinking:"",sidebar:"Explaining in English",done:""}[s];
  const hint = {first:"Tap to interrupt",welcome:"Tap to interrupt",talking:"Tap to interrupt",turn:"Tap to talk",listening:"Listening. Tap when you're done",thinking:"",sidebar:"Tap to ask more, or answer her",done:"Tap to talk"}[s];
  let mid = "";
  if(s==="first"){
    mid = `<div class="yui" style="margin-top:auto;margin-bottom:auto">${jp(L.hello)}</div>`;
  } else if(s==="welcome"){
    mid = `<div class="divider">Today</div><div class="yui" style="margin-bottom:auto">${jp(L.greet)}</div>`;
  } else if(s==="sidebar"){
    mid = `
      <div class="pinned"><div class="head">Yui's question</div>${jp(L.ask)}</div>
      <div class="fix"><div class="head">Recent fix</div>${fixRow(F.miru)}</div>
      <div class="mine en"><div class="label">You</div><div class="text">What does nan no mean?</div></div>
      <span class="mode">In English</span>
      <div class="en-answer">It means "what kind of" or "which". It goes right before a noun. For example:</div>
      <div class="example">${jp(L.ex)}</div>`;
  } else if(s==="done"){
    mid = `
      <div class="mine"><div class="label">You</div><div class="jp">またね！</div><div class="romaji">Mata ne!</div></div>
      <div class="yui">${jp(L.bye)}</div>
      <div class="done">Session done · 12 min · 3 fixes</div>`;
  } else {
    const mine = s==="thinking"
      ? `<div class="mine"><div class="label">You</div><div class="jp">トトロを見ました。</div><div class="romaji">Totoro o mimashita.</div></div>`
      : s==="listening" ? "" :
      `<div class="mine"><div class="label">You</div><div class="jp">きのう、えいがをみるました。</div><div class="romaji">Kinou, eiga o mirumashita.</div></div>`;
    const fix = (s==="talking"||s==="turn") ? `<div class="fix"><div class="head">Fix</div>${fixRow(F.miru)}</div>` : "";
    const yui = s==="thinking" ? `<div class="thinking" aria-label="Yui is thinking"><i></i><i></i><i></i></div>`
      : s==="listening" ? `<div class="yui" style="opacity:.45">${jp(L.ask)}</div><div class="wave" aria-hidden="true">${[0,.2,.4,.1,.3,.5,.15,.35].map(d=>`<i style="animation-delay:${d}s"></i>`).join("")}</div>`
      : `<div class="yui">${jp(L.ask)}</div>`;
    mid = mine + fix + yui;
  }
  return `<section class="screen conv">
    <div class="topbar"><button class="textbtn" data-go="transcript">Transcript</button><button class="youbtn" data-go="you" aria-label="You">You</button></div>
    <div class="face"><div class="avatar"><span class="kana">ゆい</span></div><div class="name">YUI</div><div class="status">${status}</div></div>
    <div class="convo">${mid}</div>
    <div class="micbar"><button class="mic" id="mic" aria-label="${hint}">${s==="listening"?STOP:MIC}</button><div class="hint">${hint}</div></div>
  </section>`;
}
const sub = (title, body, back="conversation", backLabel="Yui") =>
  `<section class="screen"><div class="subhead"><button class="back" data-go="${back}">‹ ${backLabel}</button><h1>${title}</h1></div><div class="scroll" id="scroll">${body}</div></section>`;

function transcript(){
  return sub("Transcript", `<div class="divider">Yesterday</div>${threadHTML(yesterday)}<div class="divider">Today</div>${threadHTML(today)}`);
}

const mins = [0,8,11,0,14,9,12,6,0,10,15,13,9,12];
function chart(){
  const W=320,H=120,pad=20,bw=14,max=20,gap=(W-pad*2)/14;
  const days=["W","T","F","S","S","M","T","W","T","F","S","S","M","T"];
  let bars="";
  mins.forEach((m,i)=>{
    const x=pad+i*gap+(gap-bw)/2, h=m/max*(H-34), y=H-20-h, last=i===13;
    bars+=`<rect x="${x}" y="${m?y:H-22}" width="${bw}" height="${m?h:2}" rx="3" fill="${last?"var(--accent)":m?"#8a7869":"var(--surface-2)"}"/>`;
    bars+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle" font-size="9" fill="var(--faint)">${days[i]}</text>`;
  });
  const g10=H-20-10/max*(H-34);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes per day, last 14 days"><line x1="${pad}" x2="${W-pad}" y1="${g10}" y2="${g10}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${W-pad+2}" y="${g10+3}" font-size="9" fill="var(--faint)">10m</text>${bars}</svg>`;
}
function you(){
  if(youEmpty) return sub("You", `
    <div class="stats"><div class="stat"><b>0</b><span>min today</span></div><div class="stat"><b>0</b><span>min this week</span></div><div class="stat"><b>0</b><span>day streak</span></div></div>
    <div class="section"><h2>Last 14 days</h2><div class="empty">Your talk minutes show up here after your first chat with Yui.</div></div>
    <div class="section"><h2>Level</h2><div class="empty">Your level shows after your first session.</div></div>
    <div class="section"><h2>Sessions</h2><div class="empty">No sessions yet.</div></div>`);
  return sub("You", `
    <div class="stats"><div class="stat"><b>12</b><span>min today</span></div><div class="stat"><b>65</b><span>min this week</span></div><div class="stat"><b>5</b><span>day streak</span></div></div>
    <div class="section"><h2>Last 14 days</h2><div class="chart">${chart()}</div></div>
    <div class="section"><h2>Level</h2><div class="level">
      <div class="big">N5 · 6% <small>of the way to N4</small></div>
      <div class="meter"><i style="width:6%"></i></div>
      <div class="part"><div class="row"><b>Vocabulary</b><span>96 of 1,500 words</span></div><div class="meter"><i style="width:6.4%"></i></div><p>Words you used correctly on 3 different days. 41 more are still being learned.</p></div>
      <div class="part"><div class="row"><b>Grammar</b><span>14 of 200 patterns</span></div><div class="meter"><i style="width:7%"></i></div><p>Patterns you used correctly on 3 different days. 9 more are still being learned.</p></div>
      <div class="part"><div class="row"><b>Quality</b><span>×0.95</span></div><div class="meter"><i style="width:84%"></i></div><p>71% of your Japanese replies had no fix. You knew about 96% of Yui's words. Last 5 sessions.</p></div>
    </div></div>
    <div class="section"><h2>Sessions</h2><div class="list">
      <button class="item" data-go="session"><div class="main"><b>Today</b><span>12 min · 3 fixes · a movie you watched</span></div><span class="go">›</span></button>
      <button class="item" data-go="session"><div class="main"><b>Yesterday</b><span>9 min · no fixes · Yui's bakery</span></div><span class="go">›</span></button>
      <button class="item" data-go="session"><div class="main"><b>Sun, Nov 8</b><span>13 min · 2 fixes · weekend plans</span></div><span class="go">›</span></button>
      <button class="item" data-go="session"><div class="main"><b>Sat, Nov 7</b><span>6 min · 1 fix · work</span></div><span class="go">›</span></button>
    </div></div>`, "conversation", "Yui");
}
function session(){
  return sub("Today", `
    <div class="summary">12 min · 3 fixes</div>
    <div class="section"><h2>Fixes</h2><div class="fix">${[F.miru,F.ni,F.kat].map(fixRow).join("")}</div></div>
    <div class="section"><h2>You asked about</h2><div class="list"><div class="item"><div class="main"><b class="jp"><ruby>何<rt>なん</rt></ruby>の</b><span>what kind of, which</span></div></div></div></div>
    <div class="section"><h2>Transcript</h2></div>${threadHTML(today)}`, "you", "You");
}

// ---------- Render ----------
const SCREENS=[["conversation","Conversation"],["transcript","Transcript"],["you","You"],["session","Session detail"]];
const phone=document.getElementById("phone");
function render(){
  phone.dataset.state = screen==="conversation" ? state : "";
  phone.innerHTML = {conversation,transcript,you,session}[screen]();
  document.getElementById("screens").innerHTML = SCREENS.map(([k,l])=>`<button class="chip" data-go="${k}" aria-pressed="${k===screen}">${l}</button>`).join("");
  const st = document.getElementById("states");
  if(screen==="conversation") st.innerHTML = STATES.map(([k,l])=>`<button class="chip" data-state="${k}" aria-pressed="${k===state}">${l}</button>`).join("");
  else if(screen==="you") st.innerHTML = [["0","With data"],["1","Empty"]].map(([k,l])=>`<button class="chip" data-empty="${k}" aria-pressed="${(k==="1")===youEmpty}">${l}</button>`).join("");
  else st.innerHTML = "";
  st.hidden = !st.innerHTML;
  const sc=document.getElementById("scroll");
  if(sc && screen==="transcript") sc.scrollTop=sc.scrollHeight;
}
function go(s){ screen=s; if(location.hash!=="#"+s) history.replaceState(null,"","#"+s); render(); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.go) return go(b.dataset.go);
  if(b.dataset.state){ clearTimeout(timer); state=b.dataset.state; return render(); }
  if(b.dataset.empty){ youEmpty=b.dataset.empty==="1"; return render(); }
  if(b.id==="mic"){
    clearTimeout(timer);
    state = {first:"turn",welcome:"turn",talking:"turn",turn:"listening",listening:"thinking",sidebar:"listening",done:"listening",thinking:"thinking"}[state];
    if(state==="thinking") timer=setTimeout(()=>{state="talking";render();},1400);
    render();
  }
});
function fromHash(){ const h=location.hash.slice(1); screen=SCREENS.some(([k])=>k===h)?h:"conversation"; render(); }
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
